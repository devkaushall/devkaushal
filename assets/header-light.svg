<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 262" width="1000" height="262" role="img" aria-label="Dev Kaushal — WordPress and Web Operations Specialist. Status: available. Gurugram, India.">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:17px;fill:#0f172a}
    .dim{fill:#64748b} .acc{fill:#0284c7;font-weight:700} .ok{fill:#22c55e}
    .big{font-size:30px;font-weight:700;letter-spacing:-.5px}
    .line{opacity:0;animation:show .01s linear forwards}
    .l1{animation-delay:.3s} .l2{animation-delay:1.1s} .l3{animation-delay:1.9s} .l4{animation-delay:2.7s} .l5{animation-delay:3.5s}
    .cursor{animation:blink 1s steps(1) infinite 3.6s;opacity:0}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes show{to{opacity:1}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion: reduce){.line{animation:none;opacity:1}.cursor{animation:none;opacity:1}.pulse{animation:none}}
  </style>
  <rect width="1000" height="262" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <!-- title bar -->
  <rect x="1" y="1" width="998" height="38" rx="12" fill="#e2e8f0"/>
  <rect x="1" y="20" width="998" height="19" fill="#e2e8f0"/>
  <circle cx="24" cy="20" r="6" fill="#ef4444"/><circle cx="44" cy="20" r="6" fill="#f59e0b"/><circle cx="64" cy="20" r="6" fill="#22c55e"/>
  <text x="500" y="25" text-anchor="middle" class="mono dim" style="font-size:13px">dev@command-centre — ~/wordpress-ops</text>
  <!-- lines -->
  <g class="mono">
    <text x="28" y="76" class="line l1"><tspan class="acc">❯</tspan> <tspan class="dim">whoami</tspan></text>
    <text x="28" y="112" class="line l2 big">Dev Kaushal</text>
    <text x="28" y="142" class="line l3"><tspan class="acc">WordPress &amp; Web Operations Specialist</tspan><tspan class="dim"> — builds, maintenance, speed, uptime</tspan></text>
    <text x="28" y="182" class="line l4"><tspan class="acc">❯</tspan> <tspan class="dim">status</tspan></text>
    <text x="28" y="212" class="line l5"><tspan class="ok pulse">●</tspan> AVAILABLE   <tspan class="dim">│</tspan>  Gurugram, IN (Delhi NCR)   <tspan class="dim">│</tspan>  Elementor · Astra · LiteSpeed · WooCommerce</text>
    <text x="28" y="240" class="mono"><tspan class="acc">❯</tspan> <tspan class="cursor">▍</tspan></text>
  </g>
</svg>
