<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="PageSpeed score 100. FCP 0.4s, LCP 0.8s, TBT 0ms, CLS 0.">
<style>
 .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
 .txt{fill:#f3f7fa} .mu{fill:#94a6be} .dim{fill:#546884} .cy{fill:#00f0ff} .gr{fill:#00ff88} .am{fill:#ffb703}
